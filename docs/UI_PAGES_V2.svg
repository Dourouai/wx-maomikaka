    <g color="#8F8190"><use href="#navMe" x="382" y="944" width="25" height="25"/></g>
    <text x="104" y="972" text-anchor="middle" class="tiny coral">找猫</text>
    <text x="250" y="972" text-anchor="middle" class="tiny">图鉴</text>
    <text x="394" y="972" text-anchor="middle" class="tiny">我的</text>
