  <rect x="572" y="802" width="634" height="102" rx="26" fill="#FFFDF9" stroke="#E7DCE1" stroke-width="2" filter="url(#softShadow)"/>
  <text x="596" y="829" class="smallcaps">✦ CAT FOUND ✦</text>
  <text x="596" y="864" class="serif" font-size="22" font-weight="600">橘色小家伙</text>
  <rect x="795" y="839" width="108" height="31" rx="15" fill="#F6E7BC"/>
  <text x="849" y="859" text-anchor="middle" class="sans" font-size="12" font-weight="600">R · 稀遇</text>
  <rect x="596" y="877" width="151" height="22" rx="11" fill="#F6E7BC"/>
  <text x="671" y="892" text-anchor="middle" class="sans" font-size="12" font-weight="600">猫爪 +130</text>
  <rect x="757" y="877" width="151" height="22" rx="11" fill="#DCEBE3"/>
  <text x="832" y="892" text-anchor="middle" class="sans" font-size="12" font-weight="600">咔咔分 +8</text>
  <text x="1004" y="891" class="label">咔咔分 · 兑换规则待定</text>

  <text x="572" y="955" class="sans" font-size="13" font-weight="500" fill="#8F8190">视觉基线：拍照是唯一一级动作 · 真实照片是主角 · 奖励在拍后揭示</text>
</svg>
