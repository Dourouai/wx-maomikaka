  <text x="291" y="949" class="ui" font-size="15" font-weight="800" text-anchor="middle">状态 A · 观察中 / 剩余 2 个罐罐</text>
  <text x="291" y="972" class="ui muted" font-size="12" text-anchor="middle">深色取景 + 猫爪快门 + 温柔提示</text>

  <!-- Component board -->
  <g class="ui">
    <text x="572" y="154" font-size="12" class="coral eng">CAMERA ELEMENTS</text>
    <text x="572" y="190" font-size="30" class="serif" font-weight="700">相机组件板</text>
    <text x="572" y="218" font-size="13" class="muted">更像一台猫咪观察仪，而不是普通相机</text>

    <text x="572" y="270" font-size="12" font-weight="800">相机专用色</text>
    <g filter="url(#softShadow)">
      <rect x="572" y="286" width="82" height="62" rx="13" fill="#2A222A"/>
      <rect x="664" y="286" width="82" height="62" rx="13" fill="#46333A"/>
      <rect x="756" y="286" width="82" height="62" rx="13" fill="#E68167"/>
      <rect x="848" y="286" width="82" height="62" rx="13" fill="#FFF5E8" stroke="#E0D1C1"/>
      <rect x="940" y="286" width="82" height="62" rx="13" fill="#B9CBA6"/>
    </g>
    <text x="613" y="367" font-size="10" class="muted" text-anchor="middle">夜可可</text>
    <text x="705" y="367" font-size="10" class="muted" text-anchor="middle">深莓紫</text>
    <text x="797" y="367" font-size="10" class="muted" text-anchor="middle">猫爪珊瑚</text>
    <text x="889" y="367" font-size="10" class="muted" text-anchor="middle">奶油白</text>
    <text x="981" y="367" font-size="10" class="muted" text-anchor="middle">薄荷绿</text>

    <text x="572" y="423" font-size="12" font-weight="800">核心控件</text>
    <rect x="572" y="444" width="450" height="76" rx="18" fill="#FFF5E8" stroke="#D9C7B5" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="614" cy="482" r="27" fill="none" stroke="#34251F" stroke-width="4"/>
    <circle cx="614" cy="482" r="19" fill="#E68167"/>
    <circle cx="614" cy="482" r="4" fill="#FFF5E8"/>
    <text x="660" y="477" font-size="13" font-weight="800">猫爪快门</text>
    <text x="660" y="498" font-size="11" class="muted">按下时缩小、闪光、轻震</text>
    <rect x="871" y="462" width="117" height="30" rx="11" fill="#2A222A"/>
    <text x="929" y="482" font-size="11" class="light" text-anchor="middle">今日罐罐 2 / 3</text>

    <text x="572" y="568" font-size="12" font-weight="800">可爱标签候选 A</text>
    <text x="572" y="591" font-size="11" class="muted">把稀有等级变成可以贴在卡面上的猫咪角色</text>
    <g filter="url(#softShadow)">
      <rect x="572" y="612" width="86" height="42" rx="13" fill="#E6EFDB"/>
      <rect x="670" y="612" width="86" height="42" rx="13" fill="#E9E3F0"/>
      <rect x="768" y="612" width="86" height="42" rx="13" fill="#F2DFBD"/>
      <rect x="866" y="612" width="86" height="42" rx="13" fill="#F5D4C7"/>
      <rect x="964" y="612" width="86" height="42" rx="13" fill="#E9CDD2"/>
    </g>
    <text x="615" y="638" font-size="12" text-anchor="middle" font-weight="800">C · 路过</text>
    <text x="713" y="638" font-size="12" text-anchor="middle" font-weight="800">U · 探头</text>
    <text x="811" y="638" font-size="12" text-anchor="middle" font-weight="800">R · 回眸</text>
    <text x="909" y="638" font-size="12" text-anchor="middle" font-weight="800">SR · 星光</text>
    <text x="1007" y="638" font-size="12" text-anchor="middle" font-weight="800">UR · 彩蛋</text>

    <text x="572" y="704" font-size="12" font-weight="800">结果卡奖励预览</text>
    <rect x="572" y="724" width="450" height="105" rx="18" fill="#FFF5E8" stroke="#D9C7B5" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="596" y="753" font-size="10" class="coral eng">★ CAT FOUND ★</text>
    <text x="596" y="785" font-size="18" class="serif" font-weight="700">橘色小家伙</text>
    <rect x="819" y="767" width="83" height="27" rx="9" fill="#F2DFBD"/>
    <text x="860" y="785" font-size="11" text-anchor="middle" font-weight="800">R · 回眸</text>
    <rect x="596" y="800" width="112" height="24" rx="8" fill="#F2DFBD"/>
    <text x="652" y="816" font-size="11" text-anchor="middle" font-weight="800">猫爪 +130</text>
    <rect x="718" y="800" width="112" height="24" rx="8" fill="#E9EFDE"/>
    <text x="774" y="816" font-size="11" text-anchor="middle" font-weight="800">咔咔分 +8</text>
    <text x="850" y="816" font-size="11" class="muted">自动结算</text>

    <text x="572" y="893" font-size="11" class="muted">交互关键词：靠近一点 · 看清它 · 轻轻按下</text>
  </g>
</svg>
