<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" xml:space="preserve" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="state-board-title state-board-desc" style="text-rendering:geometricPrecision">
  <title id="state-board-title">猫咪咔咔 勋章状态设计</title>
  <desc id="state-board-desc">展示勋章墙的已解锁、进行中和未开始三种状态，使用与勋章设计板相同的 SVG 外圈和图标。</desc>

  <defs>
    <pattern id="paper-grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#E7DCE1" opacity="0.42"/>
      <circle cx="16" cy="18" r="0.8" fill="#E7DCE1" opacity="0.32"/>
      <circle cx="24" cy="9" r="0.7" fill="#F4DFA9" opacity="0.34"/>
    </pattern>
    <filter id="board-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#5D5260" flood-opacity="0.13"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5D5260" flood-opacity="0.10"/>
    </filter>
    <filter id="muted-icon" x="-30%" y="-30%" width="160%" height="160%">
      <feColorMatrix type="saturate" values="0.1"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.48"/>
      </feComponentTransfer>
    </filter>
    <style><![CDATA[
      .serif { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; fill: #5D5260; }
      .sans { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; fill: #5D5260; }
      .eyebrow { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; fill: #8F8190; }
      .label { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 14px; font-weight: 500; fill: #8F8190; }
      .body { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 15px; font-weight: 400; fill: #8F8190; }
      .state-title { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-size: 25px; font-weight: 600; fill: #5D5260; }
      .badge-name { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 1px; fill: #5D5260; }
    ]]></style>
  </defs>

  <rect width="1600" height="900" fill="#FFF9F2"/>
  <rect x="24" y="24" width="1552" height="852" rx="34" fill="#FFFDF9" stroke="#E7DCE1" stroke-width="2" filter="url(#board-shadow)"/>
  <rect x="24" y="24" width="1552" height="852" rx="34" fill="url(#paper-grain)" opacity="0.64"/>

  <g aria-label="状态设计标题">
    <text x="800" y="85" text-anchor="middle" class="serif" font-size="40" font-weight="600" letter-spacing="7">勋章状态设计</text>
    <text x="800" y="121" text-anchor="middle" class="eyebrow">STATE LANGUAGE · BADGE WALL · SVG</text>
    <path d="M118 151h480M1002 151h480" stroke="#E7DCE1" stroke-width="1.5" stroke-dasharray="5 8"/>
    <circle cx="800" cy="151" r="5" fill="#F4DFA9"/>
  </g>

  <!-- Unlocked -->
  <g transform="translate(92 181)" role="group" aria-label="已解锁状态">
    <rect width="430" height="560" rx="28" fill="#FFFDF9" stroke="#DCEBE3" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="24" y="24" width="104" height="32" rx="16" fill="#DCEBE3"/>
    <circle cx="45" cy="40" r="7" fill="#6E9C8B"/>
    <path d="m41 40 3 3 6-7" fill="none" stroke="#FFFDF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="61" y="45" class="sans" font-size="13" font-weight="600" fill="#52746D">已解锁</text>
    <text x="24" y="100" class="state-title">它已经成为相遇的一部分</text>
    <text x="24" y="128" class="body">保留完整分类色、图标和柔和阴影。</text>

    <g transform="translate(215 302)">
      <use xlink:href="BADGE_DESIGN_BOARD_V3.svg#badge-shell" href="BADGE_DESIGN_BOARD_V3.svg#badge-shell" style="color:#EB7D6F"/>
      <use xlink:href="BADGE_DESIGN_BOARD_V3.svg#icon-first-meow" href="BADGE_DESIGN_BOARD_V3.svg#icon-first-meow"/>
      <circle cx="76" cy="-76" r="18" fill="#6E9C8B" stroke="#FFFDF9" stroke-width="4"/>
      <path d="m67-76 6 6 11-13" fill="none" stroke="#FFFDF9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="215" y="455" text-anchor="middle" class="badge-name">第一声喵</text>
    <text x="215" y="483" text-anchor="middle" class="label">已获得 · 2026.09.03</text>
    <rect x="105" y="510" width="220" height="38" rx="19" fill="#F2D7DE"/>
    <text x="215" y="535" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#A85F67">第 1 张有效相遇卡</text>
  </g>

  <!-- In progress -->
  <g transform="translate(585 181)" role="group" aria-label="进行中状态">
    <rect width="430" height="560" rx="28" fill="#FFFDF9" stroke="#E8DDF0" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="24" y="24" width="104" height="32" rx="16" fill="#E8DDF0"/>
    <circle cx="45" cy="40" r="7" fill="#8574A0"/>
    <path d="M45 35v5l4 3" fill="none" stroke="#FFFDF9" stroke-width="2" stroke-linecap="round"/>
    <text x="61" y="45" class="sans" font-size="13" font-weight="600" fill="#6D5C8D">进行中</text>
    <text x="24" y="100" class="state-title">还差一点点，就会亮起来</text>
    <text x="24" y="128" class="body">降低饱和度，但保留图形辨识度。</text>

    <g transform="translate(215 302)">
      <use xlink:href="BADGE_DESIGN_BOARD_V3.svg#badge-shell" href="BADGE_DESIGN_BOARD_V3.svg#badge-shell" style="color:#8574A0" opacity="0.72"/>
      <use xlink:href="BADGE_DESIGN_BOARD_V3.svg#icon-mika-glow" href="BADGE_DESIGN_BOARD_V3.svg#icon-mika-glow" opacity="0.72"/>
      <circle r="108" fill="none" stroke="#E7DCE1" stroke-width="7" opacity="0.88"/>
      <circle r="108" fill="none" stroke="#8574A0" stroke-width="7" stroke-linecap="round" stroke-dasharray="204 680" transform="rotate(-90)"/>
    </g>
    <text x="215" y="455" text-anchor="middle" class="badge-name">咪咔发光</text>
    <text x="215" y="483" text-anchor="middle" class="label">首次获得咪咔 ≥ 80 的相遇卡</text>
    <rect x="105" y="510" width="220" height="38" rx="19" fill="#E8DDF0"/>
    <text x="215" y="535" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#6D5C8D">当前进度 · 3 / 10</text>
  </g>

  <!-- Locked / not started -->
  <g transform="translate(1078 181)" role="group" aria-label="未开始状态">
    <rect width="430" height="560" rx="28" fill="#FFFDF9" stroke="#E7DCE1" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="24" y="24" width="104" height="32" rx="16" fill="#F4F0EF"/>
    <path d="M39 40v-4c0-5 3-8 7-8s7 3 7 8v4M37 40h18v13H37Z" fill="none" stroke="#8F8190" stroke-width="2" stroke-linejoin="round"/>
    <text x="61" y="45" class="sans" font-size="13" font-weight="600" fill="#8F8190">未开始</text>
    <text x="24" y="100" class="state-title">先留在这里，等一次温柔观察</text>
    <text x="24" y="128" class="body">只显示条件，不使用失败或缺失语气。</text>

    <g transform="translate(215 302)" filter="url(#muted-icon)">
      <use xlink:href="BADGE_DESIGN_BOARD_V3.svg#badge-shell" href="BADGE_DESIGN_BOARD_V3.svg#badge-shell" style="color:#B8D4C2"/>
      <use xlink:href="BADGE_DESIGN_BOARD_V3.svg#icon-gentle-observer" href="BADGE_DESIGN_BOARD_V3.svg#icon-gentle-observer"/>
    </g>
    <g transform="translate(215 302)">
      <circle cx="74" cy="-74" r="22" fill="#FFFDF9" stroke="#E7DCE1" stroke-width="2"/>
      <path d="M74-75v-5c0-5 3-8 7-8s7 3 7 8v5M71-75h20v16H71Z" fill="none" stroke="#8F8190" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="215" y="455" text-anchor="middle" class="badge-name">不打扰观察员</text>
    <text x="215" y="483" text-anchor="middle" class="label">默认无闪光模式完成 10 次有效拍摄</text>
    <rect x="105" y="510" width="220" height="38" rx="19" fill="#F4F0EF"/>
    <text x="215" y="535" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#8F8190">完成条件后点亮</text>
  </g>

  <line x1="120" y1="782" x2="1480" y2="782" stroke="#E7DCE1" stroke-width="1.5" stroke-dasharray="5 8"/>
  <g transform="translate(265 818)">
    <circle cx="0" cy="0" r="7" fill="#6E9C8B"/>
    <text x="18" y="5" class="label">已解锁：完整颜色 + 已获得时间</text>
  </g>
  <g transform="translate(665 818)">
    <circle cx="0" cy="0" r="7" fill="#8574A0"/>
    <text x="18" y="5" class="label">进行中：低饱和 + 明确进度</text>
  </g>
  <g transform="translate(1085 818)">
    <circle cx="0" cy="0" r="7" fill="#C7BDC2"/>
    <text x="18" y="5" class="label">未开始：柔和剪影 + 解锁条件</text>
  </g>
</svg>
