<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46333A"/>
      <stop offset="1" stop-color="#201A24"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B6A996"/>
      <stop offset=".48" stop-color="#81766F"/>
      <stop offset="1" stop-color="#4E4B55"/>
    </linearGradient>
    <pattern id="paperDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#C7AD9B" opacity=".42"/>
    </pattern>
    <pattern id="previewGrain" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r=".9" fill="#FFF5E8" opacity=".09"/>
      <circle cx="12" cy="10" r=".8" fill="#241A24" opacity=".1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1D1420" flood-opacity=".28"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1D1420" flood-opacity=".13"/>
    </filter>
    <clipPath id="phoneScreen"><rect x="102" y="124" width="378" height="778" rx="37"/></clipPath>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #34251F; }
      .light { fill: #FFF5E8; }
      .muted { fill: #9D8D8A; }
      .coral { fill: #E68167; }
      .eng { letter-spacing: 3px; font-weight: 800; }
      .serif { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; }
    </style>
  </defs>

  <rect width="1440" height="1024" fill="#F7F0E6"/>
  <rect width="1440" height="1024" fill="url(#paperDots)"/>
  <circle cx="1270" cy="110" r="190" fill="#D9775B" opacity=".1"/>
  <circle cx="80" cy="940" r="190" fill="#AEC39B" opacity=".1"/>

  <text x="72" y="68" class="ui" font-size="26" font-weight="800">猫咪咔咔 · 相机页视觉稿</text>
  <text x="73" y="96" class="ui muted" font-size="12">CAMERA / CUSTOM OBSERVER / V1.0 · 2026.09</text>

  <!-- Camera phone -->
  <g filter="url(#shadow)">
    <rect x="92" y="114" width="398" height="804" rx="46" fill="#FFF8EC" stroke="#D4BFAF" stroke-width="2"/>
  </g>
  <rect x="102" y="124" width="378" height="778" rx="37" fill="url(#bg)"/>
  <g clip-path="url(#phoneScreen)">
    <rect x="102" y="124" width="378" height="778" fill="url(#bg)"/>
    <circle cx="440" cy="226" r="164" fill="#E68167" opacity=".12"/>
    <circle cx="133" cy="720" r="170" fill="#B9CBA6" opacity=".08"/>

    <!-- Header -->
    <g class="ui">
      <rect x="122" y="148" width="48" height="48" rx="18" fill="#FFF5E8" opacity=".96"/>
      <path d="M151 163l-10 10 10 10" fill="none" stroke="#8A5A4C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="185" y="157" font-size="10" class="coral eng">CAT SPOTTER · 02</text>
      <text x="185" y="182" font-size="22" class="light serif" font-weight="700">轻轻拍一张</text>
      <rect x="370" y="148" width="88" height="44" rx="16" fill="#FFF5E8" opacity=".94"/>
      <text x="382" y="166" font-size="9" fill="#8D6C5F" font-weight="700">今日罐罐</text>
      <text x="382" y="184" font-size="15" class="coral" font-weight="800">2 / 3</text>

      <!-- Preview -->
      <rect x="122" y="220" width="338" height="468" rx="25" fill="url(#preview)"/>
      <rect x="122" y="220" width="338" height="468" rx="25" fill="url(#previewGrain)"/>
      <rect x="122" y="220" width="338" height="468" rx="25" fill="#2B232A" opacity=".06"/>
      <rect x="134" y="232" width="314" height="444" rx="18" fill="none" stroke="#FFF5E8" stroke-width="2" opacity=".38"/>

      <!-- Preview chips -->
      <rect x="145" y="248" width="104" height="29" rx="11" fill="#2A222A" opacity=".45"/>
      <circle cx="159" cy="262" r="5" fill="#F1C57C"/>
      <text x="171" y="267" font-size="11" class="light">猫咪观察区</text>
      <rect x="337" y="248" width="100" height="29" rx="11" fill="#2A222A" opacity=".42"/>
      <text x="350" y="267" font-size="10" class="light">不使用闪光</text>

      <!-- Fake cat silhouette -->
      <ellipse cx="290" cy="527" rx="82" ry="98" fill="#D88755" opacity=".9" transform="rotate(-8 290 527)"/>
      <path d="M240 476l7-73 45 38M337 467l28-65 14 79" fill="#D88755" opacity=".9"/>
      <ellipse cx="271" cy="513" rx="10" ry="14" fill="#FFF5E8"/>
      <ellipse cx="319" cy="510" rx="10" ry="14" fill="#FFF5E8"/>
      <circle cx="273" cy="514" r="4" fill="#30232A"/>
      <circle cx="317" cy="511" r="4" fill="#30232A"/>
      <path d="M286 540q5 6 10 0M267 552q23 22 47 0" fill="none" stroke="#5F3D35" stroke-width="3" stroke-linecap="round"/>
      <path d="M231 539l-40-8M231 551l-45 5M348 534l41-13M349 547l46 6" stroke="#FFF5E8" stroke-width="2" opacity=".6" stroke-linecap="round"/>

      <!-- Cute star stickers -->
      <path d="M189 375l5 13 14 5-14 5-5 14-5-14-14-5 14-5z" fill="#FFF5E8" stroke="#634A47" stroke-width="2"/>
      <path d="M391 388l4 10 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#F1C57C" stroke="#634A47" stroke-width="1.5"/>
      <path d="M390 583l4 9 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#C5D7AE" stroke="#634A47" stroke-width="1.5"/>

      <!-- Viewfinder corners -->
      <path d="M151 299v-24h24M429 299v-24h-24M151 610v24h24M429 610v24h-24" fill="none" stroke="#FFF5E8" stroke-width="4" stroke-linecap="round" opacity=".95"/>
      <!-- Focus -->
      <circle cx="290" cy="513" r="41" fill="none" stroke="#FFF5E8" stroke-width="2" stroke-dasharray="7 8" opacity=".75"/>
      <circle cx="290" cy="513" r="5" fill="#E68167" stroke="#FFF5E8" stroke-width="2"/>
      <rect x="150" y="633" width="174" height="30" rx="10" fill="#FFF5E8" opacity=".92"/>
      <text x="162" y="653" font-size="11" fill="#613D35">保持一点距离，不打扰它</text>
      <rect x="330" y="633" width="98" height="30" rx="10" fill="#2A222A" opacity=".44"/>
      <text x="344" y="653" font-size="11" class="light">看这里</text>

