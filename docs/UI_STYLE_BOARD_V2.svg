<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">猫咪咔咔 软萌相机 UI 风格板 V2</title>
  <desc id="desc">展示软萌相机风格的手机取景界面、配色、罐罐、快门、等级标签和结果奖励卡。</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E8DDE2" opacity="0.7"/>
    </pattern>
    <linearGradient id="cameraWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D5CBE9"/>
      <stop offset="0.52" stop-color="#B8D4C2"/>
      <stop offset="1" stop-color="#F2D7DE"/>
    </linearGradient>
    <linearGradient id="coralGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F39A83"/>
      <stop offset="1" stop-color="#EB7D6F"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#5D5260" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#5D5260" flood-opacity="0.10"/>
    </filter>
    <style>
      .serif { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; fill: #5D5260; }
      .sans { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; fill: #5D5260; }
      .muted { fill: #8F8190; }
      .cream { fill: #FFFDF9; }
      .coral { fill: #EB7D6F; }
      .smallcaps { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #EB7D6F; font-size: 11px; font-weight: 600; letter-spacing: 3px; }
      .label { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #8F8190; font-size: 12px; }
      .token-title { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #5D5260; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
      .body { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #5D5260; font-size: 15px; }
    </style>
  </defs>

  <rect width="1440" height="1024" fill="#FFF9F2"/>
  <rect width="1440" height="1024" fill="url(#dots)"/>
  <circle cx="1280" cy="44" r="170" fill="#F2D7DE" opacity="0.28"/>
  <circle cx="1360" cy="100" r="84" fill="#D5CBE9" opacity="0.23"/>
  <path d="M0 888 C145 832 225 932 346 884 L346 1024 L0 1024Z" fill="#B8D4C2" opacity="0.18"/>

  <text x="72" y="72" class="serif" font-size="31" font-weight="600">猫咪咔咔 · 软萌相机风格板 V2</text>
  <text x="74" y="101" class="smallcaps">SOFT CAMERA / GENTLE CAT SPOTTER / 2026.09</text>
  <rect x="1218" y="58" width="150" height="32" rx="16" fill="#FFFDF9" stroke="#E7DCE1"/>
  <text x="1293" y="79" text-anchor="middle" class="sans" font-size="12" font-weight="600">视觉方向定义</text>

  <!-- phone mockup -->
  <g filter="url(#phoneShadow)">
    <rect x="72" y="137" width="426" height="822" rx="42" fill="#FFFDF9" stroke="#E7DCE1" stroke-width="2"/>
  </g>
  <rect x="88" y="153" width="394" height="790" rx="31" fill="#FFF9F2"/>
  <rect x="228" y="164" width="114" height="6" rx="3" fill="#E7DCE1"/>

  <text x="116" y="208" class="smallcaps">CAT SPOTTER</text>
  <text x="116" y="237" class="serif" font-size="25" font-weight="600">正在找猫</text>
  <rect x="322" y="186" width="136" height="40" rx="20" fill="#FFFDF9" stroke="#E7DCE1"/>
  <g transform="translate(337 196)">
    <path d="M3 10 L3 3 L10 3 L13 0 L18 3 L18 10 Z" fill="#EB7D6F" opacity="0.82"/>
    <rect x="5" y="10" width="12" height="4" rx="2" fill="#EB7D6F" opacity="0.82"/>
  </g>
  <text x="363" y="211" class="sans" font-size="11" font-weight="500">今日罐罐</text>
  <text x="440" y="211" text-anchor="end" class="coral sans" font-size="14" font-weight="600">2/3</text>

  <!-- camera stage -->
  <rect x="106" y="271" width="358" height="414" rx="34" fill="url(#cameraWash)"/>
  <rect x="123" y="288" width="324" height="380" rx="25" fill="none" stroke="#FFFDF9" stroke-width="2" stroke-dasharray="7 8" opacity="0.94"/>
  <rect x="138" y="305" width="108" height="30" rx="15" fill="#FFFDF9" opacity="0.94"/>
  <circle cx="155" cy="320" r="5" fill="#EB7D6F"/>
  <text x="168" y="325" class="sans" font-size="12" font-weight="500">正在找猫</text>
  <rect x="326" y="305" width="106" height="30" rx="15" fill="#FFFDF9" opacity="0.94"/>
  <path d="M343 315 L354 326 M354 315 L343 326" stroke="#8F8190" stroke-width="2" stroke-linecap="round"/>
  <text x="363" y="325" class="sans" font-size="11" font-weight="500">不打扰模式</text>
  <!-- viewfinder corners -->
  <path d="M143 354 v-12 h12 M427 354 v-12 h-12 M143 605 v12 h12 M427 605 v12 h-12" fill="none" stroke="#FFFDF9" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <!-- small decorative stars -->
  <path d="M171 420 l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#FFFDF9" opacity="0.8"/>
  <path d="M402 405 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F4DFA9" opacity="0.95"/>
  <path d="M406 589 l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#B8D4C2" opacity="0.95"/>

  <!-- mascot -->
  <g transform="translate(286 474)">
    <path d="M-51 -67 L-57 -121 L-21 -94 M51 -67 L57 -121 L21 -94" fill="#F49A83" stroke="#C5736E" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-25" rx="72" ry="80" fill="#F49A83" stroke="#C5736E" stroke-width="3"/>
    <path d="M-42 42 C-25 67 18 70 41 41" fill="none" stroke="#C5736E" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <ellipse cx="-25" cy="-26" rx="13" ry="17" fill="#FFFDF9"/>
    <ellipse cx="25" cy="-26" rx="13" ry="17" fill="#FFFDF9"/>
    <circle cx="-21" cy="-22" r="6" fill="#5D5260"/>
    <circle cx="21" cy="-22" r="6" fill="#5D5260"/>
    <circle cx="0" cy="-1" r="7" fill="#FFFDF9" stroke="#C5736E" stroke-width="2"/>
    <path d="M-8 11 Q0 20 8 11" fill="none" stroke="#5D5260" stroke-width="2.5" stroke-linecap="round"/>
