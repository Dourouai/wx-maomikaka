.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #cc-v5-visual .cc-about-logo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #cc-v5-visual .cc-about-tagline { margin: 8px 0 0; color: var(--cc-muted); font-family: &quot;Songti SC&quot;, &quot;STSong&quot;, serif; font-size: 11px; line-height: 1.4; }
    #cc-v5-visual .cc-about-principles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 12px; }
    #cc-v5-visual .cc-about-principle { padding: 8px 3px 7px; border-top: 1px solid var(--cc-line); border-bottom: 1px solid var(--cc-line); }
    #cc-v5-visual .cc-about-principle span { display: block; color: var(--cc-terracotta); font: 8px &quot;SFMono-Regular&quot;, Menlo, monospace; }
    #cc-v5-visual .cc-about-principle b { display: block; margin-top: 4px; font-family: &quot;Songti SC&quot;, &quot;STSong&quot;, serif; font-size: 12px; }
    #cc-v5-visual .cc-about-principle small { display: block; margin-top: 3px; color: var(--cc-muted); font-size: 8px; }
    #cc-v5-visual .cc-about-ai { margin-top: 12px; }
    #cc-v5-visual .cc-about-meta { display: flex; justify-content: space-between; gap: 8px; padding-top: 10px; margin-top: 14px; border-top: 1px dashed var(--cc-line); color: var(--cc-muted); font: 8px &quot;SFMono-Regular&quot;, Menlo, monospace; }
    #cc-v5-visual .cc-about-meta strong { color: var(--cc-terracotta); font-weight: 700; }

    #cc-v5-visual .cc-bottom-nav { display: grid; grid-template-columns: repeat(3, 1fr); flex: none; min-height: 65px; border-top: 1px solid var(--cc-line); background: rgba(255, 253, 248, .96); }
    #cc-v5-visual .cc-nav-item { display: grid; place-items: center; align-content: center; gap: 3px; border: 0; color: var(--cc-muted); background: transparent; cursor: pointer; font-size: 9px; }
    #cc-v5-visual .cc-nav-item svg { width: 20px; height: 20px; overflow: visible; }
    #cc-v5-visual .cc-nav-item:not(.cc-nav-active) svg { opacity: .78; }
    #cc-v5-visual .cc-nav-item.cc-nav-active { color: var(--cc-terracotta); font-weight: 750; }
    #cc-v5-visual .cc-preview-foot { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--cc-muted); font-size: 10px; }
    #cc-v5-visual .cc-preview-foot strong { color: var(--cc-terracotta); }

    @media (max-width: 820px) {
      #cc-v5-visual { padding: 16px; }
      #cc-v5-visual .cc-board { grid-template-columns: 1fr; }
      #cc-v5-visual .cc-spec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
      #cc-v5-visual .cc-section { margin: 0; }
      #cc-v5-visual .cc-section:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 520px) {
      #cc-v5-visual { padding: 9px; }
      #cc-v5-visual .cc-heading { display: block; }
      #cc-v5-visual .cc-version { display: inline-block; margin-top: 13px; }
      #cc-v5-visual .cc-board { padding: 13px; }
      #cc-v5-visual .cc-spec { display: block; }
      #cc-v5-visual .cc-section { padding-bottom: 14px; margin-bottom: 14px; }
      #cc-v5-visual .cc-phone { height: 700px; }
      #cc-v5-visual .cc-all-pages { grid-template-columns: 1fr; }
      #cc-v5-visual .cc-cat-file-hero { padding: 7px; }
      #cc-v5-visual .cc-cat-file-photo { height: 205px; }
      #cc-v5-visual .cc-cat-file-photo svg { width: 151px; height: 180px; }
      #cc-v5-visual .cc-cat-file-photo-label { padding: 7px 8px 6px; margin: 7px 3px 0; }
      #cc-v5-visual .cc-cat-file-photo-label strong { font-size: 16px; }
      #cc-v5-visual .cc-cat-file-photo-label &gt; span:last-child { font-size: 6px; }
      #cc-v5-visual .cc-cat-file-section { margin-top: 13px; }
    }
    @container (max-width: 265px) {
      #cc-v5-visual .cc-cat-file-page { padding-right: 12px; padding-left: 12px; }
      #cc-v5-visual .cc-cat-file-header { gap: 7px; margin-bottom: 11px; }
      #cc-v5-visual .cc-cat-file-back { width: 28px; height: 28px; }
      #cc-v5-visual .cc-cat-file-title { font-size: 18px; }
      #cc-v5-visual .cc-cat-file-hero { padding: 7px; border-radius: 13px; }
      #cc-v5-visual .cc-cat-file-photo { height: 198px; }
      #cc-v5-visual .cc-cat-file-photo svg { width: 143px; height: 173px; }
      #cc-v5-visual .cc-cat-file-photo-label { gap: 2px; padding: 7px 8px 6px; margin: 7px 2px 0; }
      #cc-v5-visual .cc-cat-file-photo-label strong { font-size: 15px; }
      #cc-v5-visual .cc-cat-file-photo-label strong small { font-size: 7px; }
      #cc-v5-visual .cc-cat-file-tags { gap: 4px; padding-top: 7px; }
      #cc-v5-visual .cc-cat-file-tag { padding: 4px 6px; font-size: 7px; }
      #cc-v5-visual .cc-cat-file-data { padding-top: 8px; margin-top: 7px; }
      #cc-v5-visual .cc-cat-file-data-row { padding: 0 4px; font-size: 7px; }
      #cc-v5-visual .cc-cat-file-data-row b { font-size: 7px; }
      #cc-v5-visual .cc-field-note-card { padding: 9px; }
      #cc-v5-visual .cc-field-note-card p { font-size: 11px; }
      #cc-v5-visual .cc-field-note-meta { gap: 5px; font-size: 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #cc-v5-visual .cc-loading-cat,
      #cc-v5-visual .cc-loading-dot { animation: none; }
    }

                  &lt;div class=&quot;cc-info-heading&quot;&gt;&lt;p class=&quot;cc-info-kicker&quot;&gt;PRIVACY NOTE · 01&lt;/p&gt;&lt;h2 class=&quot;cc-info-title&quot;&gt;隐私条款&lt;/h2&gt;&lt;/div&gt;

                &lt;div class=&quot;cc-info-intro&quot;&gt;&lt;span class=&quot;cc-info-icon&quot;&gt;&lt;svg&gt;&lt;use href=&quot;#cc-icon-paw&quot;&gt;&lt;/use&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div&gt;&lt;strong&gt;猫咪咔咔小程序隐私指引&lt;/strong&gt;&lt;p&gt;开发者仅处理实现小程序功能所必要的信息，并在需要时先征得你的明示同意。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;cc-privacy-section cc-privacy-section-first&quot;&gt;
                  &lt;div class=&quot;cc-info-section-head&quot;&gt;&lt;strong&gt;开发者处理的信息&lt;/strong&gt;&lt;span&gt;WHAT WE COLLECT&lt;/span&gt;&lt;/div&gt;
                  &lt;p&gt;本指引是猫咪咔咔小程序开发者（以下简称“开发者”）为处理你的个人信息而制定。根据法律规定，开发者仅处理实现小程序功能所必要的信息。&lt;/p&gt;
                  &lt;div class=&quot;cc-privacy-permissions&quot;&gt;
                    &lt;div class=&quot;cc-privacy-permission&quot;&gt;&lt;span class=&quot;cc-privacy-permission-icon&quot;&gt;&lt;svg&gt;&lt;use href=&quot;#cc-icon-placeholder&quot;&gt;&lt;/use&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div&gt;&lt;b&gt;位置信息&lt;/b&gt;&lt;small&gt;在获取你的明示同意后收集，用于记录相遇地点、补充街角档案与展示相遇轨迹。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
                    &lt;div class=&quot;cc-privacy-permission&quot;&gt;&lt;span class=&quot;cc-privacy-permission-icon&quot;&gt;&lt;svg&gt;&lt;use href=&quot;#cc-icon-user&quot;&gt;&lt;/use&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div&gt;&lt;b&gt;微信昵称、头像&lt;/b&gt;&lt;small&gt;在获取你的明示同意后收集，用于识别你的个人档案、展示相遇记录与区分账号。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
                    &lt;div class=&quot;cc-privacy-permission&quot;&gt;&lt;span class=&quot;cc-privacy-permission-icon&quot;&gt;&lt;svg&gt;&lt;use href=&quot;#cc-icon-camera&quot;&gt;&lt;/use&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div&gt;&lt;b&gt;摄像头&lt;/b&gt;&lt;small&gt;在获取你的明示同意后访问，用于拍摄猫咪并完成本次相遇识别。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
                    &lt;div class=&quot;cc-privacy-permission&quot;&gt;&lt;span class=&quot;cc-privacy-permission-icon&quot;&gt;&lt;svg&gt;&lt;use href=&quot;#cc-icon-album&quot;&gt;&lt;/use&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div&gt;&lt;b&gt;选中的照片或视频&lt;/b&gt;&lt;small&gt;仅处理你主动选中的照片或视频，用于生成相遇记录、识别猫咪与制作档案卡。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;

                &lt;div class=&quot;cc-privacy-section&quot;&gt;
                  &lt;div class=&quot;cc-info-section-head&quot;&gt;&lt;strong&gt;第三方 AI 服务&lt;/strong&gt;&lt;span&gt;AI PROCESSING&lt;/span&gt;&lt;/div&gt;
                  &lt;p&gt;为完成猫咪图片识别、结果生成与档案整理，开发者可能接入第三方 AI 模型服务。在你同意相机或照片权限并主动发起识别后，你提交的照片或视频，以及完成识别所必需的文本和参数，可能通过 API 传输至下列服务商中的一个进行处理。&lt;/p&gt;
                  &lt;div class=&quot;cc-privacy-provider-list&quot;&gt;

                    &lt;div class=&quot;cc-privacy-provider&quot;&gt;&lt;span class=&quot;cc-privacy-provider-mark&quot;&gt;&lt;svg&gt;&lt;use href=&quot;#cc-icon-kaka&quot;&gt;&lt;/use&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div&gt;&lt;b&gt;智谱 GML 5.3 &lt;em&gt;型号待核对&lt;/em&gt;&lt;/b&gt;&lt;small&gt;用途：猫咪识别结果生成、档案文案整理；处理数据：本次提交的图片或视频及必要参数。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;

                  &lt;div class=&quot;cc-privacy-sdk&quot;&gt;&lt;strong&gt;处理边界：&lt;/strong&gt;相关数据可能由腾讯云或智谱处理，但不等同于向第三方公开发布。当前产品规划仅限完成识别与档案功能；是否用于模型训练、保存多久、删除方式及是否发生跨境传输，须以实际服务协议、控制台配置和服务商官方规则核验后确定。&lt;/div&gt;

                &lt;div class=&quot;cc-privacy-section&quot;&gt;

                  &lt;p&gt;若你是 14 周岁以下的未成年人，请和你的监护人共同仔细阅读本指引，并在征得监护人明示同意后继续使用小程序服务。开发者将依照相关法律法规及本指引处理经监护人同意收集的信息，并保障未成年人依法享有的权利。&lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;cc-privacy-section&quot;&gt;

                  &lt;ul class=&quot;cc-privacy-points&quot;&gt;

                    &lt;li&gt;照片或视频：小程序主页右上角“…”—“设置”—“小程序已获取的信息”—点击特定信息—点击“通知开发者删除”。开发者收到通知后将删除信息；法律法规另有规定的，除存储和必要安全保护外停止处理。&lt;/li&gt;
                    &lt;li&gt;你可以通过以下联系方式行使查阅、复制、更正、删除等法定权利；如注册了账号，也可以申请注销账号，开发者在受理后十五个工作日内完成核查和处理。&lt;/li&gt;
                  &lt;/ul&gt;
                  &lt;div class=&quot;cc-privacy-contact&quot;&gt;&lt;span&gt;个人信息与账号申请&lt;/span&gt;&lt;strong&gt;huters@qq.com&lt;/strong&gt;&lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;cc-privacy-section&quot;&gt;
                  &lt;div class=&quot;cc-info-section-head&quot;&gt;&lt;strong&gt;信息的存储&lt;/strong&gt;&lt;span&gt;STORAGE&lt;/span&gt;&lt;/div&gt;
                  &lt;p&gt;除法律法规另有规定外，开发者不设置超出必要范围的固定存储期限；对你的信息保存期限为实现处理目的所必要的最短时间。你申请删除后，开发者将按本指引及法律法规要求处理。&lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;cc-privacy-section&quot;&gt;
                  &lt;div class=&quot;cc-info-section-head&quot;&gt;&lt;strong&gt;信息的使用规则&lt;/strong&gt;&lt;span&gt;USE&lt;/span&gt;&lt;/div&gt;
                  &lt;p&gt;开发者将在本指引明示的用途内使用收集的信息。如使用目的或范围超出本指引，开发者将在变更前通过弹窗或页面提示再次告知，并征得你的明示同意。&lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;cc-privacy-section&quot;&gt;
                  &lt;div class=&quot;cc-info-section-head&quot;&gt;&lt;strong&gt;信息对外提供&lt;/strong&gt;&lt;span&gt;DISCLOSURE&lt;/span&gt;&lt;/div&gt;
                  &lt;p&gt;开发者不会主动共享或转让你的信息至任何第三方。如确需共享或转让，将直接征得你的单独同意，或确认第三方已征得你的单独同意。开发者不会对外公开披露你的信息；如必须公开披露，将告知目的、信息类型及可能涉及的信息，并征得你的单独同意。&lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;cc-privacy-section cc-privacy-section-last&quot;&gt;
                  &lt;div class=&quot;cc-info-section-head&quot;&gt;&lt;strong&gt;联系我们&lt;/strong&gt;&lt;span&gt;CONTACT&lt;/span&gt;&lt;/div&gt;
                  &lt;p&gt;如果你认为开发者未遵守上述约定，或有投诉建议、未成年人个人信息保护相关问题，可通过以下方式联系开发者，也可以向微信进行投诉。&lt;/p&gt;

      let revealTimer = 0;
      const allPages = root.querySelector(&quot;#cc-all-pages&quot;);
      const templateShell = root.querySelector(&quot;.cc-template-shell&quot;);

          const clone = templateShell.cloneNode(true);
          clone.classList.remove(&quot;cc-template-shell&quot;);

          allPages.appendChild(clone);

      }

      const navItems = [...templateShell.querySelectorAll(&quot;[data-nav]&quot;)];
      const templateActions = [...templateShell.querySelectorAll(&quot;[data-goto]&quot;)];

      navItems.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; go(button.dataset.nav)));
      templateActions.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {

      deleteTriggers.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; setDeleteOpen(true)));
      deleteCancels.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; setDeleteOpen(false)));
      deleteConfirms.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; go(&quot;album&quot;)));

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {

        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }

  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };

    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;

    const panelId = selected.getAttribute(&quot;aria-controls&quot;);

      const active = tab === selected;

      const id = tab.getAttribute(&quot;aria-controls&quot;);

      return;
    }

      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);

    }

  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
