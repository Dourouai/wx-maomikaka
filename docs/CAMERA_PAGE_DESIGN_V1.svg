      <rect x="102" y="710" width="378" height="192" fill="#2A222A" opacity=".93"/>
      <text x="126" y="739" font-size="10" class="coral eng">ONE SHOT · ONE ENCOUNTER</text>
      <text x="126" y="765" font-size="16" class="light serif" font-weight="700">轻轻按下，收下这次相遇</text>
      <text x="126" y="790" font-size="11" fill="#B9A8A4">本次会使用 1 个罐罐</text>

      <!-- Shutter button -->
      <circle cx="291" cy="843" r="50" fill="none" stroke="#FFF5E8" stroke-width="7" opacity=".94"/>
      <circle cx="291" cy="843" r="38" fill="#E68167" stroke="#F7C8B5" stroke-width="3"/>
      <g transform="translate(273 824) scale(.45)">
        <ellipse cx="27" cy="27" rx="7" ry="9" transform="rotate(-28 27 27)" fill="#FFF5E8"/>
        <ellipse cx="41" cy="22" rx="7" ry="9" transform="rotate(-8 41 22)" fill="#FFF5E8"/>
        <ellipse cx="55" cy="27" rx="7" ry="9" transform="rotate(28 55 27)" fill="#FFF5E8"/>
        <path d="M40.5 38c-11 0-19 8-19 18 0 8 6 12 13 12 5 0 7-3 10-3s5 3 10 3c7 0 13-4 13-12 0-10-8-18-19-18-3 0-5 1-8 1s-5-1-8-1Z" fill="#FFF5E8"/>
      </g>
      <text x="291" y="894" font-size="10" class="light" text-anchor="middle">拍照</text>

