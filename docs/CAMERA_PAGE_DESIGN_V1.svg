      <circle cx="153" cy="843" r="25" fill="#FFF5E8" opacity=".12"/>
      <path d="M143 838h20v12h-20zM147 836h12l2 3h-16z" fill="none" stroke="#FFF5E8" stroke-width="1.8" opacity=".86"/>
      <text x="153" y="879" font-size="9" class="light" text-anchor="middle" opacity=".86">保持距离</text>
      <circle cx="428" cy="843" r="25" fill="#FFF5E8" opacity=".12"/>
      <path d="M417 834l22 18M439 834l-22 18" stroke="#F1C57C" stroke-width="2.4" stroke-linecap="round"/>
      <text x="428" y="879" font-size="9" class="light" text-anchor="middle" opacity=".86">无闪光</text>
    </g>
