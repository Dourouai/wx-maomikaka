    <rect x="102" y="312" width="300" height="348" rx="24" fill="none" stroke="#FFFDF9" stroke-width="2" stroke-dasharray="7 8" opacity="0.96"/>
    <rect x="116" y="330" width="100" height="28" rx="14" fill="#FFFDF9" opacity="0.94"/>
