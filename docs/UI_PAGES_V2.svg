<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">猫咪咔咔三页 UI 设计图 V2</title>
  <desc id="desc">展示首页找猫、图鉴列表和我的页面的软萌相机视觉设计。</desc>
  <defs>
    <pattern id="pageDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E8DDE2" opacity="0.68"/>
    </pattern>
    <linearGradient id="finderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D5CBE9"/>
      <stop offset="0.5" stop-color="#B8D4C2"/>
      <stop offset="1" stop-color="#F2D7DE"/>
    </linearGradient>
    <linearGradient id="photoOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8C4A7"/>
      <stop offset="1" stop-color="#D58C79"/>
    </linearGradient>
    <linearGradient id="photoMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8E8DB"/>
      <stop offset="1" stop-color="#9DC1B3"/>
    </linearGradient>
    <linearGradient id="photoLavender" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6DDF0"/>
      <stop offset="1" stop-color="#B6A8D0"/>
    </linearGradient>
    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#5D5260" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5D5260" flood-opacity="0.10"/>
    </filter>
    <style>
      .serif { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; fill: #5D5260; }
      .sans { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; fill: #5D5260; }
      .muted { fill: #8F8190; }
      .cream { fill: #FFFDF9; }
      .coral { fill: #EB7D6F; }
      .eyebrow { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #EB7D6F; font-size: 10px; font-weight: 600; letter-spacing: 2.5px; }
      .caption { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #8F8190; font-size: 12px; }
      .phoneLabel { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #5D5260; font-size: 14px; font-weight: 600; }
      .tiny { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #8F8190; font-size: 10px; }
    </style>
    <symbol id="pawIcon" viewBox="0 0 40 40">
      <path d="M13 18c-4 1-7-1-7-5 0-3 2-6 5-6s5 3 5 6c0 2-1 4-3 5Zm14 0c-2-1-3-3-3-5 0-3 2-6 5-6s5 3 5 6c0 4-3 6-7 5ZM9 29c0-5 5-9 11-9s11 4 11 9c0 4-4 6-11 6S9 33 9 29Z" fill="currentColor"/>
    </symbol>
    <symbol id="canIcon" viewBox="0 0 34 34">
      <path d="M7 11h20v14H7z" fill="currentColor" opacity="0.88"/>
      <path d="M9 8h11l4 3H9z" fill="currentColor"/>
      <path d="M11 26h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="miniCat" viewBox="0 0 100 100">
      <path d="M22 37 19 13l20 15m39 9 3-24-20 15" fill="#F49A83" stroke="#C5736E" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="50" cy="52" r="32" fill="#F49A83" stroke="#C5736E" stroke-width="3"/>
      <ellipse cx="39" cy="50" rx="6" ry="8" fill="#FFFDF9"/>
      <ellipse cx="61" cy="50" rx="6" ry="8" fill="#FFFDF9"/>
      <circle cx="40" cy="51" r="3" fill="#5D5260"/>
      <circle cx="60" cy="51" r="3" fill="#5D5260"/>
      <circle cx="50" cy="62" r="4" fill="#FFFDF9" stroke="#C5736E" stroke-width="1.5"/>
      <path d="M46 68q4 5 8 0" fill="none" stroke="#5D5260" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="navHome" viewBox="0 0 36 36">
      <path d="M7 17 18 8l11 9v12H7z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M14 29v-8h8v8" fill="none" stroke="currentColor" stroke-width="2.4"/>
    </symbol>
    <symbol id="navBook" viewBox="0 0 36 36">
      <path d="M7 9c4-2 8-1 11 2v18c-3-3-7-4-11-2zM29 9c-4-2-8-1-11 2v18c3-3 7-4 11-2z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="navMe" viewBox="0 0 36 36">
      <circle cx="18" cy="13" r="5" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M8 30c1-6 5-9 10-9s9 3 10 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1440" height="1060" fill="#FFF9F2"/>
  <rect width="1440" height="1060" fill="url(#pageDots)"/>
  <circle cx="1325" cy="66" r="170" fill="#F2D7DE" opacity="0.25"/>
  <circle cx="1180" cy="1000" r="180" fill="#D5CBE9" opacity="0.18"/>
  <path d="M0 932c142-51 230 61 366 8v120H0Z" fill="#B8D4C2" opacity="0.18"/>

  <text x="62" y="67" class="serif" font-size="31" font-weight="600">猫咪咔咔 · 三页 UI 设计图 V2</text>
  <text x="64" y="96" class="eyebrow">HOME / ALBUM / MY MEOW / SOFT CAMERA SYSTEM</text>
  <text x="1172" y="72" class="sans muted" font-size="13">同一套视觉 · 三个清晰重点</text>

  <!-- Page labels -->
  <g>
    <rect x="52" y="126" width="400" height="32" rx="16" fill="#F2D7DE"/>
    <text x="72" y="147" class="phoneLabel">01　首页 / 找猫</text>
    <text x="433" y="147" text-anchor="end" class="caption">第一重点：现在就拍</text>
  </g>
  <g>
    <rect x="520" y="126" width="400" height="32" rx="16" fill="#D5CBE9"/>
    <text x="540" y="147" class="phoneLabel">02　图鉴 / 列表</text>
    <text x="901" y="147" text-anchor="end" class="caption">第二重点：看见收集</text>
  </g>
  <g>
    <rect x="988" y="126" width="400" height="32" rx="16" fill="#B8D4C2"/>
    <text x="1008" y="147" class="phoneLabel">03　我的 / 个人</text>
    <text x="1369" y="147" text-anchor="end" class="caption">第三重点：留下成长</text>
  </g>

  <!-- phone shells -->
  <g filter="url(#frameShadow)">
    <rect x="52" y="168" width="400" height="820" rx="40" fill="#FFFDF9" stroke="#E7DCE1" stroke-width="2"/>
    <rect x="520" y="168" width="400" height="820" rx="40" fill="#FFFDF9" stroke="#E7DCE1" stroke-width="2"/>
    <rect x="988" y="168" width="400" height="820" rx="40" fill="#FFFDF9" stroke="#E7DCE1" stroke-width="2"/>
  </g>
  <rect x="66" y="182" width="372" height="792" rx="28" fill="#FFF9F2"/>
  <rect x="534" y="182" width="372" height="792" rx="28" fill="#FFF9F2"/>
  <rect x="1002" y="182" width="372" height="792" rx="28" fill="#FFF9F2"/>
