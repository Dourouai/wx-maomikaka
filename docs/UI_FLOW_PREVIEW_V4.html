<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>猫咪咔咔 · 街角猫档案 UI 预览 V4</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f1e5;
      --surface: #fff9ef;
      --ink: #2f2420;
      --muted: #8b776a;
      --line: #d8c7b7;
      --clay: #a94731;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      background:
        radial-gradient(circle at 92% 4%, rgba(232, 193, 173, .28), transparent 16rem),
        radial-gradient(circle at 8% 92%, rgba(231, 235, 221, .58), transparent 22rem),
        var(--paper);
    }
    .preview-header,
    .preview-board,
    .preview-footer { width: min(1800px, calc(100% - 40px)); margin: 0 auto; }
    .preview-header {
      padding: 30px 0 20px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
    }
    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.2;
      font-weight: 600;
    }
    .eyebrow {
      margin: 9px 0 0;
      color: var(--clay);
      font-family: "SFMono-Regular", "Menlo", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .18em;
    }
    .tag {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--muted);
      background: rgba(255, 249, 239, .82);
      font-family: "SFMono-Regular", "Menlo", monospace;
      font-size: 11px;
      white-space: nowrap;
    }
    .preview-board {
      overflow: auto;
      padding: 12px;
      border: 1px solid rgba(216, 199, 183, .95);
      background: rgba(255, 249, 239, .62);
      box-shadow: 0 18px 50px rgba(47, 36, 32, .09);
    }
    .preview-board img { display: block; width: 100%; min-width: 1100px; height: auto; }
    .preview-footer {
      padding: 16px 0 32px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
    }
    a { color: var(--clay); text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .preview-header,
      .preview-board,
      .preview-footer { width: calc(100% - 24px); }
      .preview-header { align-items: start; flex-direction: column; padding-top: 20px; }
      .preview-board { padding: 7px; }
      .preview-board img { min-width: 1000px; }
      .preview-footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="preview-header">
    <div>
      <h1>猫咪咔咔 · 街角猫档案 UI 视觉稿 V4</h1>
      <p class="eyebrow">CITY CAT ARCHIVE / STREET OBSERVATION KIT / UI PREVIEW</p>
    </div>
    <span class="tag">HTML PREVIEW · STYLE DIRECTION</span>
  </header>
  <main class="preview-board">
    <img src="./UI_FLOW_PAGES_V4.svg" alt="街角猫档案风格的首页、拍照页、图鉴页、我的页面、状态机和元素图标">
  </main>
  <footer class="preview-footer">
    <span>首页 · 状态机 · 拍照页 · 图鉴页 · 我的页面 · 元素图标</span>
    <a href="./UI_FLOW_PAGES_V4.svg">打开原始 SVG 设计图 →</a>
  </footer>
</body>
</html>
