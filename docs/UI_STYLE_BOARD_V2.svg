  <text x="630" y="713" text-anchor="middle" class="sans" font-size="13" font-weight="600">C · 街角</text>
  <text x="758" y="713" text-anchor="middle" class="sans" font-size="13" font-weight="600">U · 偶见</text>
  <text x="886" y="713" text-anchor="middle" class="sans" font-size="13" font-weight="600">R · 稀遇</text>
  <text x="1014" y="713" text-anchor="middle" class="sans" font-size="13" font-weight="600">SR · 惊鸿</text>
  <text x="1145" y="713" text-anchor="middle" class="sans" font-size="13" font-weight="600">UR · 神隐</text>

