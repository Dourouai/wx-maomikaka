    <path d="M-68 2 L-105 -5 M-68 8 L-108 13 M68 2 L105 -5 M68 8 L108 13" stroke="#FFFDF9" stroke-width="2" stroke-linecap="round"/>
    <path d="M61 54 C103 50 115 77 99 100" fill="none" stroke="#C5736E" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="285" y="637" text-anchor="middle" class="sans cream" font-size="13" opacity="0.96">它在这里 · 保持一点距离</text>

  <!-- controls -->
  <text x="108" y="718" class="smallcaps">ONE SHOT · ONE ENCOUNTER</text>
  <text x="108" y="747" class="serif" font-size="19" font-weight="600">轻轻按下，收下这次相遇</text>
  <text x="108" y="771" class="label">会使用 1 个罐罐</text>
  <g>
    <circle cx="151" cy="852" r="28" fill="#DCEBE3"/>
    <rect x="139" y="844" width="24" height="16" rx="3" fill="none" stroke="#52746D" stroke-width="2"/>
    <path d="M144 840 h14" stroke="#52746D" stroke-width="2" stroke-linecap="round"/>
    <text x="151" y="895" text-anchor="middle" class="label">相册</text>
  </g>
  <g filter="url(#softShadow)">
    <circle cx="285" cy="852" r="50" fill="#FFFDF9" stroke="#D5CBE9" stroke-width="3"/>
    <circle cx="285" cy="852" r="37" fill="url(#coralGlow)" stroke="#EB7D6F" stroke-width="2"/>
    <path d="M272 854 l7-7 6 5 6-5 7 7-4 13 h-18z" fill="#FFFDF9"/>
    <circle cx="279" cy="853" r="3" fill="#EB7D6F"/>
    <circle cx="291" cy="853" r="3" fill="#EB7D6F"/>
    <circle cx="285" cy="864" r="3" fill="#EB7D6F"/>
    <text x="285" y="925" text-anchor="middle" class="label">拍照</text>
  </g>
  <g>
    <circle cx="419" cy="852" r="28" fill="#E7DDF0"/>
    <path d="M408 841 L430 863 M430 841 L408 863" stroke="#7B6A86" stroke-width="2.5" stroke-linecap="round"/>
    <text x="419" y="895" text-anchor="middle" class="label">闪光关闭</text>
  </g>

  <text x="285" y="986" text-anchor="middle" class="sans" font-size="13" font-weight="600">01 / 相机页 · 主动作只有“拍照”</text>

  <!-- right design system -->
  <text x="572" y="178" class="smallcaps">SOFT CAMERA ELEMENTS</text>
  <text x="572" y="215" class="serif" font-size="29" font-weight="600">轻、软、让猫咪成为主角</text>
  <text x="572" y="244" class="body muted">低饱和糖果色 + 大留白 + 轻量反馈，先让用户看见还能拍几次。</text>

  <text x="572" y="292" class="token-title">01 · 色彩基线</text>
  <g filter="url(#softShadow)">
    <rect x="572" y="314" width="118" height="80" rx="18" fill="#FFF9F2" stroke="#E7DCE1"/>
    <rect x="701" y="314" width="118" height="80" rx="18" fill="#F2D7DE"/>
    <rect x="830" y="314" width="118" height="80" rx="18" fill="#EB7D6F"/>
    <rect x="959" y="314" width="118" height="80" rx="18" fill="#D5CBE9"/>
    <rect x="1088" y="314" width="118" height="80" rx="18" fill="#B8D4C2"/>
  </g>
  <text x="631" y="420" text-anchor="middle" class="label">奶油白</text>
  <text x="631" y="439" text-anchor="middle" class="label">#FFF9F2</text>
  <text x="760" y="420" text-anchor="middle" class="label">奶糖粉</text>
  <text x="760" y="439" text-anchor="middle" class="label">#F2D7DE</text>
  <text x="889" y="420" text-anchor="middle" class="label">猫爪珊瑚</text>
  <text x="889" y="439" text-anchor="middle" class="label">#EB7D6F</text>
  <text x="1018" y="420" text-anchor="middle" class="label">云朵紫</text>
  <text x="1018" y="439" text-anchor="middle" class="label">#D5CBE9</text>
  <text x="1147" y="420" text-anchor="middle" class="label">薄荷绿</text>
  <text x="1147" y="439" text-anchor="middle" class="label">#B8D4C2</text>

  <text x="572" y="493" class="token-title">02 · 组件性格</text>
  <!-- can counter -->
  <rect x="572" y="519" width="246" height="67" rx="23" fill="#FFFDF9" stroke="#E7DCE1"/>
  <g transform="translate(594 535)">
    <path d="M3 12 L3 4 L11 4 L14 1 L20 4 L20 12 Z" fill="#EB7D6F"/>
    <rect x="5" y="12" width="13" height="5" rx="2" fill="#EB7D6F"/>
  </g>
  <text x="630" y="546" class="label">今日罐罐</text>
  <text x="630" y="568" class="sans" font-size="17" font-weight="600">2/3</text>
  <text x="710" y="558" class="label">顶部持续可见</text>
  <!-- status -->
  <rect x="838" y="519" width="190" height="67" rx="23" fill="#FFFDF9" stroke="#E7DCE1"/>
  <rect x="857" y="538" width="115" height="29" rx="15" fill="#F2D7DE"/>
  <circle cx="875" cy="552" r="5" fill="#EB7D6F"/>
  <text x="889" y="557" class="sans" font-size="12" font-weight="500">正在找猫</text>
  <text x="993" y="558" class="label">短句</text>
  <!-- shutter -->
  <rect x="1048" y="519" width="158" height="67" rx="23" fill="#FFFDF9" stroke="#E7DCE1"/>
  <circle cx="1083" cy="552" r="22" fill="#FFFDF9" stroke="#D5CBE9" stroke-width="2"/>
  <circle cx="1083" cy="552" r="16" fill="#EB7D6F"/>
  <path d="M1077 552 l5-5 4 4 4-4 5 5-3 9 h-12z" fill="#FFFDF9"/>
  <text x="1114" y="557" class="sans" font-size="13" font-weight="600">猫爪快门</text>

  <text x="572" y="640" class="token-title">03 · 五级相遇标签</text>
  <text x="572" y="665" class="label">代码保留 C / U / R / SR / UR，用户看到的是有故事的短标签。</text>
  <g filter="url(#softShadow)">
    <rect x="572" y="688" width="116" height="39" rx="19" fill="#DCEBE3"/>
    <rect x="700" y="688" width="116" height="39" rx="19" fill="#E7DDF0"/>
    <rect x="828" y="688" width="116" height="39" rx="19" fill="#F6E7BC"/>
    <rect x="956" y="688" width="116" height="39" rx="19" fill="#F2D7DE"/>
    <rect x="1084" y="688" width="122" height="39" rx="19" fill="#E4D5E2"/>
